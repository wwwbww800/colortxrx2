<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空間差分色碼接收端（Reed-Solomon）</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#0f0f0f;color:#ddd;font-family:system-ui,"Noto Sans TC",sans-serif}
  #wrap{max-width:720px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  #vbox{position:relative;width:100%;background:#000;min-height:120px;border-radius:6px;overflow:hidden}
  #v{width:100%;display:block}
  #ov{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .row>*{flex:1;min-width:130px}
  label{font-size:12px;color:#999;display:flex;flex-direction:column;gap:3px}
  input,select,button,textarea{font-size:16px;padding:8px;border-radius:5px;border:2px solid #555;width:100%;background:#1a1a1a;color:#eee}
  button{background:#2b6;color:#fff;border:0;cursor:pointer}
  button.stop{background:#c44}
  button.sec{background:#444}
  input[type=range]{padding:0}
  #live{display:flex;gap:6px}
  #live div{flex:1;height:44px;border-radius:4px;border:1px solid #444;font:10px/1.2 monospace;display:flex;align-items:flex-end;padding:2px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
  #status{font:13px/1.6 monospace;color:#8c8;white-space:pre-wrap;min-height:60px}
  #packets{font:14px/1.9 monospace;word-break:break-all;max-height:200px;overflow:auto}
  #packets span{padding:1px 4px;margin:1px;border-radius:3px;display:inline-block;background:#1f2a22;color:#cfc}
  #packets span.warn{background:#5a4a14;color:#fe9}
  #packets span.bad{background:#6a1f1f;color:#fcc}
  #packets span.fix{background:#1c3a5a;color:#9cf;text-decoration:underline}
  #packets span.hdr{opacity:.55;border-bottom:2px solid #c93}
  #packets span.crc{border-bottom:2px solid #6ad}
  #packets span.par{opacity:.55;font-style:italic}
  textarea{font-family:monospace;min-height:90px;resize:vertical}
  small{color:#888}
  #curve{width:100%;height:auto;border:1px solid #333;border-radius:6px;background:#161616}
</style>
</head>
<body>
<div id="wrap">
  <div id="vbox"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas></div>

  <div class="row">
    <button id="cam">啟動相機</button>
    <button id="lock" class="sec">嘗試鎖定曝光／白平衡</button>
  </div>

  <div class="row">
    <label>取樣範圍大小（拖曳畫面上的框移動位置）
      <input type="range" id="size" min="15" max="95" value="60"></label>
    <label>畫面旋轉（發射端畫面在相機中的方向）
      <select id="rot">
        <option value="0">0°（左上=−10，右上=+10）</option>
        <option value="90">順時針 90°</option>
        <option value="180">180°</option>
        <option value="270">逆時針 90°</option>
      </select></label>
  </div>

  <div class="row">
    <label>封包時間 ms（需與發射端相同）<input id="ms" type="number" value="100" min="80" step="10"></label>
    <label>原始 hex 長度（選填，用來去掉補的 0）<input id="len" type="number" min="1" placeholder="例如 180"></label>
  </div>

  <div class="row">
    <button id="go">開始接收</button>
    <button id="rst" class="sec">重置</button>
  </div>

  <div id="live"><div id="sA">−10</div><div id="sB">+10</div><div id="sG">灰階</div><div id="sK">黑</div></div>
  <div id="status">請先啟動相機，把發射端畫面的四個色塊對準取樣框。</div>

  <label>由 16 階灰階校準即時建立的 Gamma 曲線（橫軸 = 螢幕送出值 0–255，縱軸 = 相對灰階 #808080 的響應；實線 = 左上區塊、虛線 = 右上區塊、點 = 實測）</label>
  <canvas id="curve" width="640" height="220"></canvas>

  <label>解碼出的封包（橘 = 信心偏低，紅 = 疑似錯誤，藍底底線 = 已由 Reed-Solomon 修正；橘底線 = 標頭，藍底線 = CRC，斜體 = 校驗）</label>
  <div id="packets"></div>
  <label>hex 輸出</label>
  <textarea id="hex" readonly></textarea>
  <button id="copy" class="sec">複製 hex</button>
  <label>文字輸出（每 6 個 hex 字元 = 1 個字；去掉尾端的 f 後，當十進位 Unicode）</label>
  <textarea id="textOut" readonly></textarea>
  <button id="copyText" class="sec">複製文字</button>
  <small>需要 https 或 localhost 才能使用相機。請使用後置鏡頭、固定手機（最好用支架）、固定螢幕亮度。</small>
</div>

<script>
const $ = id => document.getElementById(id);

/* ============================================================
   分析核心（與 DOM 無關）
   每個 frame：{t: 時間(ms), f: Float32Array(12)}
   f 的排列 = 邏輯區塊 A(左上 −10) 0..2、B(右上 +10) 3..5、G(左下 灰階) 6..8、K(右下 黑) 9..11，各為 R,G,B
   ============================================================ */
/*RS_START*/
/* ============================================================
   Reed-Solomon over GF(2^12)：一個符號 = 12 bit = 一個封包（3 個 hex 字元）
   · 本原多項式 x^12 + x^6 + x^4 + x + 1 (0x1053)，根 α^0 … α^(nsym−1)
   · 系統碼：資料在前、校驗在後；codeword 長度 n ≤ 4095
   · 解碼支援「錯誤 + 抹除」：2·錯誤 + 抹除 ≤ nsym（抹除 = 已知位置不可靠的封包）
   ============================================================ */
const RS = (() => {
  const SIZE = 4096, ORDER = 4095, PRIM = 0x1053;
  const EXP = new Uint16Array(ORDER * 2), LOG = new Uint16Array(SIZE);
  (function(){
    let x = 1;
    for(let i=0;i<ORDER;i++){ EXP[i] = x; LOG[x] = i; x <<= 1; if(x & SIZE) x ^= PRIM; }
    for(let i=ORDER;i<ORDER*2;i++) EXP[i] = EXP[i-ORDER];
  })();
  const mul = (a,b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];
  const div = (a,b) => a === 0 ? 0 : EXP[LOG[a] + ORDER - LOG[b]];
  const alpha = n => EXP[((n % ORDER) + ORDER) % ORDER];

  /* 多項式（低次在前） */
  function pmul(a,b){
    const r = new Array(a.length + b.length - 1).fill(0);
    for(let i=0;i<a.length;i++){ if(!a[i]) continue; for(let j=0;j<b.length;j++) r[i+j] ^= mul(a[i], b[j]); }
    return r;
  }
  function peval(p, x){            // 低次在前
    let acc = 0;
    for(let i=p.length-1;i>=0;i--) acc = mul(acc, x) ^ p[i];
    return acc;
  }
  const genCache = new Map();
  function generator(nsym){        // 回傳「高次在前」，首項為 1
    if(genCache.has(nsym)) return genCache.get(nsym);
    let g = [1];
    for(let i=0;i<nsym;i++) g = pmul(g, [alpha(i), 1]);
    const gh = g.slice().reverse();
    genCache.set(nsym, gh);
    return gh;
  }
  /* 編碼：msg 為符號陣列（高次在前），回傳 parity（長度 nsym） */
  function parity(msg, nsym){
    const gh = generator(nsym), rem = new Array(nsym).fill(0);
    for(let i=0;i<msg.length;i++){
      const fb = msg[i] ^ rem[0];
      for(let j=0;j<nsym;j++){
        rem[j] = (j+1 < nsym ? rem[j+1] : 0) ^ (fb ? mul(fb, gh[j+1]) : 0);
      }
    }
    return rem;
  }
  const encode = (msg, nsym) => msg.concat(parity(msg, nsym));

  function syndromes(c, nsym){
    const s = new Array(nsym).fill(0);
    for(let j=0;j<nsym;j++){
      const x = alpha(j); let acc = 0;
      for(let i=0;i<c.length;i++) acc = mul(acc, x) ^ c[i];
      s[j] = acc;
    }
    return s;
  }
  /* 解碼：recv = 收到的符號（高次在前），erasures = 抹除位置（陣列索引）
     回傳 {ok, data(更正後 codeword), nErr, nEra, errPos} */
  function decode(recv, nsym, erasures){
    const n = recv.length, c = recv.slice();
    erasures = Array.from(new Set(erasures || [])).filter(i => i >= 0 && i < n);
    const fail = () => ({ok:false, data:recv.slice(), nErr:0, nEra:erasures.length, errPos:[]});
    if(n > ORDER || nsym < 1 || nsym >= n) return fail();
    const syn = syndromes(c, nsym);
    if(syn.every(v => v === 0)) return {ok:true, data:c, nErr:0, nEra:0, errPos:[]};
    const rho = erasures.length;
    if(rho > nsym) return fail();
    const degOf = i => n - 1 - i;
    let gamma = [1];
    for(const e of erasures) gamma = pmul(gamma, [1, alpha(degOf(e))]);
    let xi = pmul(syn, gamma).slice(0, nsym);
    while(xi.length < nsym) xi.push(0);
    const T = xi.slice(rho);
    /* Berlekamp–Massey（在 Forney 修正後的症狀上找「錯誤」定位多項式） */
    let C = [1], B = [1], L = 0, m = 1, b = 1;
    for(let i=0;i<T.length;i++){
      let d = T[i];
      for(let j=1;j<=L;j++) if(j < C.length) d ^= mul(C[j], T[i-j]);
      if(d === 0){ m++; continue; }
      const coef = div(d, b), Cn = C.slice();
      while(Cn.length < B.length + m) Cn.push(0);
      for(let j=0;j<B.length;j++) Cn[j+m] ^= mul(coef, B[j]);
      if(2*L <= i){ B = C; L = i + 1 - L; b = d; m = 1; } else m++;
      C = Cn;
    }
    while(C.length > 1 && C[C.length-1] === 0) C.pop();
    const nu = C.length - 1;
    if(nu !== L || 2*nu + rho > nsym) return fail();
    /* Chien 搜尋：Λ_e(α^-d) = 0 的 d 就是錯誤的次數位置 */
    const errDeg = [];
    for(let d=0; d<n; d++){
      if(peval(C, alpha(-d)) === 0) errDeg.push(d);
    }
    if(errDeg.length !== nu) return fail();
    const eraDeg = erasures.map(degOf);
    for(const d of errDeg) if(eraDeg.includes(d)) return fail();
    const allDeg = eraDeg.concat(errDeg);
    const lam = pmul(C, gamma);
    let omega = pmul(syn, lam).slice(0, nsym);
    const dlam = new Array(Math.max(lam.length - 1, 1)).fill(0);   // 形式導數（特徵 2：只剩奇次項）
    for(let i=1;i<lam.length;i+=2) dlam[i-1] = lam[i];
    for(const d of allDeg){
      const xinv = alpha(-d), X = alpha(d);
      const den = peval(dlam, xinv);
      if(den === 0) return fail();
      const mag = mul(X, div(peval(omega, xinv), den));   // fcr = 0
      c[n-1-d] ^= mag;
    }
    if(!syndromes(c, nsym).every(v => v === 0)) return fail();
    return {ok:true, data:c, nErr:nu, nEra:rho, errPos:errDeg.map(d => n-1-d)};
  }

  /* CRC-24（poly 0x864CFB），逐位元處理每個 12 bit 符號 → 回傳 2 個符號 */
  function crc24(syms){
    let crc = 0xB704CE;
    for(const s of syms){
      for(let b=11;b>=0;b--){
        const bit = (s >> b) & 1;
        const top = (crc >> 23) & 1;
        crc = (crc << 1) & 0xFFFFFF;
        if(top ^ bit) crc ^= 0x864CFB;
      }
    }
    return [(crc >> 12) & 0xFFF, crc & 0xFFF];
  }
  return {encode, parity, decode, crc24, EXP, LOG, SIZE, ORDER};
})();

/* ============================================================
   訊框格式
   [標頭 codeword：3 個資料符號 + HDR_NSYM 個校驗]  [資料 codeword：CRC24(2) + 酬載 + 校驗]
   標頭資料符號：h0 = (0xA5<<4)|補0數 、h1 = K（資料符號數，含 CRC 的 2 個）、h2 = nsym
   ============================================================ */
const HDR_NSYM = 20, HDR_N = 3 + HDR_NSYM, HDR_MAGIC = 0xA5, MIN_NSYM = 16;
function rsParityFor(K, ratio){ return Math.max(MIN_NSYM, Math.ceil(K * ratio)); }
/* hex 字串 → 酬載符號（每 3 個 hex 一個符號，不足補 0）與補 0 數 */
function hexToSyms(hex){
  const pad = (3 - hex.length % 3) % 3;
  const h = hex + '0'.repeat(pad), syms = [];
  for(let i=0;i<h.length;i+=3) syms.push(parseInt(h.slice(i,i+3), 16));
  return {syms, pad};
}
function symsToHex(syms){ return syms.map(s => s.toString(16).padStart(3,'0')).join(''); }
/* 建立整個訊框；回傳 {symbols, kinds, K, nsym, pad, nTotal} 或 {error} */
function buildFrame(hex, ratio){
  const {syms, pad} = hexToSyms(hex);
  const msg = RS.crc24(syms).concat(syms), K = msg.length;
  let nsym = rsParityFor(K, ratio);
  if(K + nsym > RS.ORDER) nsym = RS.ORDER - K;
  if(nsym < 8) return {error:'訊息太長：資料符號 ' + K + ' 個，超過 Reed-Solomon 上限（4095 個符號含校驗）'};
  const hdr = RS.encode([(HDR_MAGIC << 4) | pad, K, nsym], HDR_NSYM);
  const body = RS.encode(msg, nsym);
  const symbols = hdr.concat(body);
  const kinds = [].concat(new Array(HDR_N).fill('hdr'), new Array(2).fill('crc'), new Array(syms.length).fill('dat'), new Array(nsym).fill('par'));
  return {symbols, kinds, K, nsym, pad, nTotal: symbols.length};
}
/*RS_END*/

/*ANALYSIS_START*/
let frames = [], calObj = null;
const failed = new Set();
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const mean3 = (f,o) => (f[o]+f[o+1]+f[o+2]) / 3;
const wrap256 = x => ((x % 256) + 256) % 256;
const SENT_A = k => wrap256(16*k - 10);   // 左上區塊（−10）實際送出的值
const SENT_B = k => 16*k + 10;            // 右上區塊（+10）實際送出的值
const HEXC = '0123456789abcdef';

/* ============================================================
   相對比例歸一：n = (X − K) / (G − K)
   K = 第四區塊（全黑，sent 0）→ 扣掉黑位準、漏光、相機偏移
   G = 第三區塊（#808080，sent 128）→ 當作 1.0，抵消曝光/白平衡/增益
   → n 是「相對於灰階的比例」，只和螢幕送出值有關，曝光或白平衡改變時仍穩定。
   G、K 在整個傳輸中固定不變，所以用前後一段時間平均（pad）降低雜訊。
   ============================================================ */

/* 校準第 0 格：A = 246（很亮）、B = 10（很暗），三個通道都成立（用歸一後的比例判斷） */
function isCal0(f){
  for(let c=0;c<3;c++){
    const d = f[6+c] - f[9+c];
    if(d < 15) return false;
    const nA = (f[c]-f[9+c]) / d, nB = (f[3+c]-f[9+c]) / d;
    if(!(nA > 1.3 && nB < 0.45)) return false;
  }
  return true;
}
function lowerBound(x){
  let lo=0, hi=frames.length;
  while(lo<hi){ const m=(lo+hi)>>1; if(frames[m].t < x) lo=m+1; else hi=m; }
  return lo;
}
/* 時間窗 [t1,t2] 內 A、B 的平均 → 歸一：n = (X − K) / (G − K)
   G、K 的曝光/增益只會緩慢漂移，所以用窗前後 pad 內的平均（雜訊小）。
   另外回傳 nb：改用「同一時間窗」內的 K 來扣，專門給黑畫面偵測用——
   K 的漏光會隨當下畫面亮度變動，只有同一瞬間的 K 才能和黑色的 A、B 對得上。
   回傳 {n, nb: Float32Array(6) [A.rgb, B.rgb], gk: 各通道 (G−K) 原始差, G, K} */
function windowNorm(t1, t2, pad){
  let lo = lowerBound(t1), hi = lowerBound(t2), idx = [];
  for(let i=lo;i<hi;i++) idx.push(i);
  if(!idx.length){
    const c = (t1+t2)/2;
    if(!frames.length) return null;
    let j = lowerBound(c);
    if(j >= frames.length) j = frames.length-1;
    if(j > 0 && Math.abs(frames[j-1].t-c) < Math.abs(frames[j].t-c)) j--;
    if(Math.abs(frames[j].t - c) > 120) return null;
    idx = [j];
  }
  const last = frames.length - 1;
  const gl = Math.min(idx[0], lowerBound(t1 - pad));
  const gh = Math.min(last, Math.max(idx[idx.length-1], lowerBound(t2 + pad) - 1));
  const G = [0,0,0], K = [0,0,0], Kw = [0,0,0], m = new Float32Array(6);
  for(let i=gl;i<=gh;i++){
    const f = frames[i].f;
    for(let c=0;c<3;c++){ G[c] += f[6+c]; K[c] += f[9+c]; }
  }
  for(const i of idx){
    const f = frames[i].f;
    for(let c=0;c<3;c++){ m[c] += f[c]; m[3+c] += f[3+c]; Kw[c] += f[9+c]; }
  }
  const ng = gh - gl + 1, n = new Float32Array(6), nb = new Float32Array(6), gk = [0,0,0];
  for(let c=0;c<3;c++){
    G[c] /= ng; K[c] /= ng; m[c] /= idx.length; m[3+c] /= idx.length; Kw[c] /= idx.length;
    gk[c] = G[c] - K[c];
    const d = Math.max(gk[c], 8);
    n[c]  = (m[c]-K[c]) / d;   n[3+c]  = (m[3+c]-K[c]) / d;
    nb[c] = (m[c]-Kw[c]) / d;  nb[3+c] = (m[3+c]-Kw[c]) / d;
  }
  return {n, nb, gk, G, K};
}
/* 用 16 格校準的「格內變異最小」找出精確起點 t0（只看時間，用原始亮度即可） */
function refineT0(tg, T){
  const lumAB = f => mean3(f,0) + mean3(f,3);
  const scores = []; let minS = Infinity;
  for(let off=-0.6*T; off<=0.6*T; off+=2){
    const t0 = tg + off; let s = 0;
    for(let k=0;k<16;k++){
      const lo = lowerBound(t0 + k*T + 0.1*T), hi = lowerBound(t0 + (k+1)*T - 0.1*T);
      const n = hi - lo;
      if(n < 2){ s += 1e6; continue; }
      let m=0, m2=0;
      for(let i=lo;i<hi;i++){ const v = lumAB(frames[i].f); m+=v; m2+=v*v; }
      s += m2/n - (m/n)*(m/n);
    }
    scores.push([t0,s]); if(s < minS) minS = s;
  }
  if(minS >= 1e6) return null;
  const near = scores.filter(x => x[1] <= minS*1.2 + 1).map(x => x[0]).sort((a,b)=>a-b);
  return near[(near.length-1)>>1];
}

/* ============================================================
   Gamma 轉譯曲線：由 16 階灰階校準即時建立
   曲線 = 「螢幕送出值 s (0..255) → 歸一後的相機響應 n」（每區塊、每通道各一條）
   資料點：黑格 (0, 黑位準) + 16 格的 (16k−10 或 16k+10, 實測 n)
   1) 先做單調（非遞減）回歸，去掉雜訊造成的上下抖動
   2) 再嘗試擬合 n = b + β·(s/128)^γ；殘差夠小就用擬合曲線（可再平滑雜訊），
      否則（相機有 S 曲線、飽和…）改用實測點的分段線性曲線
   ============================================================ */
function pav(ys, ws){
  const bl = [];
  for(let i=0;i<ys.length;i++){
    bl.push({s:ys[i]*ws[i], w:ws[i], n:1});
    while(bl.length > 1){
      const a = bl[bl.length-2], b = bl[bl.length-1];
      if(a.s/a.w <= b.s/b.w) break;
      bl.splice(bl.length-2, 2, {s:a.s+b.s, w:a.w+b.w, n:a.n+b.n});
    }
  }
  const out = [];
  for(const b of bl) for(let i=0;i<b.n;i++) out.push(b.s/b.w);
  return out;
}
function buildCurve(pts){
  pts = pts.slice().sort((p,q) => p[0]-q[0]);
  const xs = pts.map(p => p[0]), raw = pts.map(p => p[1]), N = xs.length;
  const mono = pav(raw, pts.map(p => p[0]===0 ? 3 : 1));
  let sse = 0; for(let i=0;i<N;i++) sse += (raw[i]-mono[i])**2;
  const rmsPav = Math.sqrt(sse/N);
  let best = null;
  for(let g=0.4; g<=4.001; g+=0.02){
    let sx=0, sy=0, sxx=0, sxy=0;
    for(let i=0;i<N;i++){ const x = Math.pow(xs[i]/128, g); sx+=x; sy+=raw[i]; sxx+=x*x; sxy+=x*raw[i]; }
    const den = N*sxx - sx*sx; if(Math.abs(den) < 1e-9) continue;
    const beta = (N*sxy - sx*sy) / den, b = (sy - beta*sx) / N;
    if(beta <= 0) continue;
    let e = 0; for(let i=0;i<N;i++){ const r = raw[i] - (b + beta*Math.pow(xs[i]/128, g)); e += r*r; }
    if(!best || e < best.e) best = {g, b, beta, e};
  }
  const rmsFit = best ? Math.sqrt(best.e/N) : Infinity;
  let model = 'points', cx = xs, cy = mono;
  if(best && rmsFit < 0.045){
    model = 'gamma'; cx = []; cy = [];
    for(let s=0;s<=255;s++){ cx.push(s); cy.push(best.b + best.beta*Math.pow(s/128, best.g)); }
  }
  return {xs:cx, ys:cy, model, gamma: best ? best.g : NaN, rmsFit, rmsPav, rawX:xs, raw};
}
function evalCurve(cv, x){
  const xs = cv.xs, ys = cv.ys, n = xs.length;
  if(x <= xs[0]) return ys[0] + (ys[1]-ys[0])/(xs[1]-xs[0]) * (x-xs[0]);
  if(x >= xs[n-1]) return ys[n-1] + (ys[n-1]-ys[n-2])/(xs[n-1]-xs[n-2]) * (x-xs[n-1]);
  let lo = 0, hi = n-1;
  while(hi-lo > 1){ const m = (lo+hi)>>1; if(xs[m] <= x) lo = m; else hi = m; }
  return ys[lo] + (ys[hi]-ys[lo]) * (x-xs[lo]) / (xs[hi]-xs[lo]);
}
/* 反曲線：由歸一響應回推「螢幕送出值」 */
function invCurve(cv, y){
  const xs = cv.xs, ys = cv.ys, n = xs.length;
  if(y <= ys[0]){
    const sl = Math.max((ys[1]-ys[0])/(xs[1]-xs[0]), 1e-3);
    return clamp(xs[0] + (y-ys[0])/sl, -40, 300);
  }
  if(y >= ys[n-1]){
    const sl = Math.max((ys[n-1]-ys[n-2])/(xs[n-1]-xs[n-2]), 1e-3);
    return clamp(xs[n-1] + (y-ys[n-1])/sl, -40, 300);
  }
  let lo = 0, hi = n-1;
  while(hi-lo > 1){ const m = (lo+hi)>>1; if(ys[m] < y) lo = m; else hi = m; }
  const dy = ys[hi] - ys[lo];
  return dy < 1e-9 ? (xs[lo]+xs[hi])/2 : xs[lo] + (xs[hi]-xs[lo]) * (y-ys[lo]) / dy;
}
const slopeAt = (cv, x) => (evalCurve(cv, x+8) - evalCurve(cv, x-8)) / 16;

/* ============================================================
   驗證並建立校準（歸一 + 曲線）
   ============================================================ */
function tryCal(tg, T){
  const t0 = refineT0(tg, T); if(t0 === null) return null;
  const pad = Math.max(200, 2*T);
  const cells = [];
  for(let k=0;k<=16;k++){
    const w = windowNorm(t0+k*T+0.25*T, t0+(k+1)*T-0.25*T, pad);
    if(!w) return null; cells.push(w);
  }
  const gk = [0,0,0];
  for(let k=0;k<16;k++) for(let c=0;c<3;c++) gk[c] += cells[k].gk[c]/16;
  if((gk[0]+gk[1]+gk[2])/3 < 20) return null;           // 灰階與黑差太小：沒看到螢幕
  const LA = [], LB = [], LAb = [], LBb = [];
  for(let k=0;k<=16;k++){
    LA.push(mean3(cells[k].n,0));   LB.push(mean3(cells[k].n,3));
    LAb.push(mean3(cells[k].nb,0)); LBb.push(mean3(cells[k].nb,3));
  }
  const tol = 0.10;
  if(LA[0]-LB[0] < 0.5) return null;
  for(let k=0;k<15;k++){
    if(LB[k+1] < LB[k]-tol) return null;
    if(k>=1 && LA[k+1] < LA[k]-tol) return null;
  }
  if(LB[15]-LB[0] < 0.8) return null;
  if(LA[15]-LA[1] < 0.8) return null;
  /* 全黑間隔 / 黑畫面的判斷：用同時刻 K 扣除後的值（nb） */
  let mm = Infinity;
  for(let k=1;k<16;k++) mm = Math.min(mm, Math.max(LAb[k], LBb[k]));
  const gthr = 0.5*mm + 0.03;
  if(!(LAb[16] < gthr && LBb[16] < gthr)) return null;   // 校準後的全黑間隔
  /* 黑畫面門檻：最暗的資料等級響應的一半，但不低於 0.05（約 3 倍單一 frame 的雜訊） */
  const blackThr = Math.max(0.5*mm, 0.05);

  /* 每區塊、每通道的 gamma 曲線 */
  const cA = [], cB = [];
  for(let c=0;c<3;c++){
    const pa = [[0, cells[16].n[c]]], pb = [[0, cells[16].n[3+c]]];
    for(let k=0;k<16;k++){ pa.push([SENT_A(k), cells[k].n[c]]); pb.push([SENT_B(k), cells[k].n[3+c]]); }
    cA.push(buildCurve(pa)); cB.push(buildCurve(pb));
  }
  let sq = 0;
  for(const cv of cA.concat(cB)) sq += (cv.model === 'gamma' ? cv.rmsFit : cv.rmsPav*1.3) ** 2;
  const sigmaN = clamp(Math.sqrt(sq/6), 0.012, 0.08);    // 歸一響應的雜訊估計

  /* 16 個等級在曲線上的預期響應，與每個等級到最近鄰的距離（用來估信心） */
  const PA = [], PB = [], DN = [];
  for(let k=0;k<16;k++){
    PA.push([0,1,2].map(c => evalCurve(cA[c], SENT_A(k))));
    PB.push([0,1,2].map(c => evalCurve(cB[c], SENT_B(k))));
  }
  for(let k=0;k<16;k++){
    DN.push([0,1,2].map(c => {
      let d = Infinity;
      for(let j=0;j<16;j++) if(j !== k) d = Math.min(d, Math.hypot(PA[k][c]-PA[j][c], PB[k][c]-PB[j][c]));
      return d;
    }));
  }
  return {t0, T, pad, gk, blackThr, cA, cB, PA, PB, DN, sigmaN};
}
function isBlackFrame(f, cal){
  let al = 0, bl = 0;
  for(let c=0;c<3;c++){
    const d = Math.max(cal.gk[c], 8);
    al += (f[c]-f[9+c]) / d; bl += (f[3+c]-f[9+c]) / d;
  }
  return (al/3) < cal.blackThr && (bl/3) < cal.blackThr;
}
/* 讀取第 from…to−1 個封包（0 = 第一個標頭封包）→ 符號、旗標與「可疑度」分數 */
function readPackets(cal, tStart, T, from, to){
  const nibs = [], syms = [], flags = [], scores = [];
  for(let m=from;m<to;m++){
    const s = tStart + m*T;
    const w = windowNorm(s+0.25*T, s+0.75*T, cal.pad);
    if(!w){ nibs.push([0,0,0]); syms.push(0); flags.push(2); scores.push(9); continue; }
    const tri = [0,0,0]; let flag = 0, sc = 0;
    for(let c=0;c<3;c++){
      const a = w.n[c], b = w.n[3+c];
      /* 在歸一響應空間找最近的等級（雜訊在此空間近似均勻） */
      let best = Infinity, bi = 0;
      for(let k=0;k<16;k++){
        const d = (a-cal.PA[k][c])**2 + (b-cal.PB[k][c])**2;
        if(d < best){ best = d; bi = k; }
      }
      tri[c] = bi;
      const ratio = Math.sqrt(best) / Math.max(cal.DN[bi][c], 1e-6);   // 離最近等級的距離 / 與鄰近等級的間距
      if(ratio > 0.45) flag = Math.max(flag, 2); else if(ratio > 0.30) flag = Math.max(flag, 1);
      sc = Math.max(sc, ratio/0.45);
      /* ±10 差分驗證：經反曲線回推螢幕送出值後，右上 − 左上 應 = +20（對 256 取餘） */
      const sa = invCurve(cal.cA[c], a), sb = invCurve(cal.cB[c], b);
      let diff = sb - sa; diff = wrap256(diff + 128) - 128;
      const sla = Math.max(slopeAt(cal.cA[c], sa), 0.0015), slb = Math.max(slopeAt(cal.cB[c], sb), 0.0015);
      const z = Math.abs(diff - 20) / (cal.sigmaN * Math.hypot(1/sla, 1/slb));
      if(z > 6) flag = Math.max(flag, 2); else if(z > 3.5) flag = Math.max(flag, 1);
      sc = Math.max(sc, z/6);
      /* 每個封包的灰階/黑區塊：曝光或白平衡偏離校準時的程度 */
      const gr = w.gk[c] / cal.gk[c];
      if(gr < 0.7 || gr > 1.43){ flag = Math.max(flag, 1); sc = Math.max(sc, 0.5); }
    }
    nibs.push(tri); syms.push((tri[0]<<8) | (tri[1]<<4) | tri[2]); flags.push(flag); scores.push(sc);
  }
  return {nibs, syms, flags, scores};
}

/* ============================================================
   Reed-Solomon 軟判決解碼
   把「最可疑」的 e 個封包當成抹除（位置已知，只花 1 份校驗），其餘當作可能的錯誤（花 2 份）。
   依序嘗試 e = 紅色封包數、紅+橘封包數、0，再由小到大逐步增加到 nsym，
   第一個通過 accept()（CRC 或標頭檢查）的結果就採用。
   ============================================================ */
function softRS(syms, scores, flags, nsym, accept, budgetMs){
  const n = syms.length;
  const key = i => flags[i]*10 + scores[i];
  const order = Array.from({length:n}, (_,i) => i).sort((a,b) => key(b) - key(a));
  const nRed = flags.filter(f => f === 2).length, nFlag = flags.filter(f => f >= 1).length;
  const counts = [];
  const add = e => { if(e >= 0 && e <= nsym && e < n && !counts.includes(e)) counts.push(e); };
  add(nRed); add(nFlag); add(0);
  const step = Math.max(1, Math.floor(nsym/32));
  for(let e=step; e<=nsym; e+=step) add(e);
  add(nsym);
  const t0 = Date.now();
  for(const e of counts){
    const eras = order.slice(0, e);
    const r = RS.decode(syms, nsym, eras);
    if(r.ok && accept(r.data)) return {data:r.data, nErr:r.nErr, nEra:e, tried:counts.indexOf(e)+1};
    if(Date.now() - t0 > budgetMs) break;
  }
  return null;
}
const crcOk = (cw, K) => { const c = RS.crc24(cw.slice(2, K)); return c[0] === cw[0] && c[1] === cw[1]; };

/* 讀完的封包 → 標頭 → 資料。complete = 是否已收完（缺的封包當作抹除） */
function rsProcess(pk, complete, guess){
  const out = {hdr:null, data:null, stage:'wait'};
  const n = pk.syms.length;
  if(n < HDR_N) return out;
  const h = softRS(pk.syms.slice(0,HDR_N), pk.scores.slice(0,HDR_N), pk.flags.slice(0,HDR_N), HDR_NSYM,
    cw => (cw[0] >> 4) === HDR_MAGIC && (cw[0] & 15) <= 2 && cw[1] >= 3 && cw[2] >= 8 && cw[1] + cw[2] <= RS.ORDER, 1500);
  let K, nsym, pad, nTotal;
  if(h){
    K = h.data[1]; nsym = h.data[2]; pad = h.data[0] & 15; nTotal = HDR_N + K + nsym;
    out.hdr = {ok:true, K, nsym, pad, nTotal, nErr:h.nErr, nEra:h.nEra};
  } else {
    /* 標頭救不回來：由「收到的封包總數」反推可能的 (K, nsym)（發射端的校驗強度只有幾個預設值），
       逐一嘗試，由資料的 CRC-24 判定哪一組正確。補 0 數無從得知，假設 0（多出的 0 不影響文字）。 */
    out.hdr = {ok:false};
    if(!complete || !guess){ out.stage = 'hdr-fail'; return out; }
    const nCw0 = n - HDR_N, seen = new Set();
    for(const dn of [0, -1, 1, -2, 2]){
      const nCw = nCw0 + dn;
      for(const ratio of [1, 0.5, 2, 0.25, 3]){
        for(let k=3;k<nCw;k++){
          if(k + rsParityFor(k, ratio) !== nCw) continue;
          const key = k + ':' + (nCw-k); if(seen.has(key)) continue; seen.add(key);
          const syms = pk.syms.slice(HDR_N, HDR_N + nCw), scores = pk.scores.slice(HDR_N, HDR_N + nCw), flags = pk.flags.slice(HDR_N, HDR_N + nCw);
          while(syms.length < nCw){ syms.push(0); scores.push(9); flags.push(2); }
          const r = softRS(syms, scores, flags, nCw - k, cw => crcOk(cw, k), 1500);
          if(r){
            const fixed = [];
            for(let i=0;i<syms.length;i++) if(r.data[i] !== syms[i]) fixed.push(HDR_N + i);
            out.hdr = {ok:false, guessed:true, K:k, nsym:nCw-k, pad:0, nTotal:HDR_N+nCw};
            out.data = {ok:true, hex:symsToHex(r.data.slice(2, k)), nErr:r.nErr, nEra:r.nEra, fixed, tried:r.tried};
            out.stage = 'ok';
            return out;
          }
        }
      }
    }
    out.stage = 'hdr-fail'; return out;
  }
  if(n < nTotal && !complete){ out.stage = 'partial'; return out; }
  const syms = pk.syms.slice(HDR_N, nTotal), scores = pk.scores.slice(HDR_N, nTotal), flags = pk.flags.slice(HDR_N, nTotal);
  const have = syms.length;
  while(syms.length < K + nsym){ syms.push(0); scores.push(9); flags.push(2); }
  out.missing = K + nsym - have;
  const r = softRS(syms, scores, flags, nsym, cw => crcOk(cw, K), 6000);
  if(!r){ out.stage = 'data-fail'; return out; }
  const fixed = [];
  for(let i=0;i<syms.length;i++) if(r.data[i] !== syms[i] && i < have) fixed.push(HDR_N + i);
  let hex = symsToHex(r.data.slice(2, K));
  if(pad) hex = hex.slice(0, hex.length - pad);
  out.data = {ok:true, hex, nErr:r.nErr, nEra:r.nEra, fixed, tried:r.tried};
  out.stage = 'ok';
  return out;
}

function decodeWith(cal, final){
  const n = frames.length, tLast = frames[n-1].t;
  const T0 = cal.T, tS = cal.t0 + 17*T0;          // 第 0 個封包（標頭第一個）的起點
  /* 找結束的全黑畫面：持續 ≥ 3 個封包時間，且其中 ≥ 85% 的 frame 為黑 */
  const i0 = lowerBound(tS);
  const pre = new Int32Array(n+1), isB = new Uint8Array(n);
  for(let i=0;i<n;i++){
    isB[i] = (i >= i0 && isBlackFrame(frames[i].f, cal)) ? 1 : 0;
    pre[i+1] = pre[i] + isB[i];
  }
  let e = -1;
  for(let i=Math.max(i0,1); i<n; i++){
    if(!isB[i]) continue;
    const j = lowerBound(frames[i].t + 3*T0);
    if(j >= n) break;
    if(pre[j]-pre[i] >= 0.85*(j-i)){ e = i; break; }
  }
  const tEnd = e > 0 ? (frames[e-1].t + frames[e].t)/2 : null;
  const done = tEnd !== null, complete = done || final;
  const Npk0 = done ? Math.max(0, Math.round((tEnd - tS)/T0))
                    : Math.max(0, Math.floor((tLast - tS)/T0 - 0.75) + 1);
  const attempt = (T, shift, count, guess) => {
    const pk = readPackets(cal, tS + shift*T0, T, 0, count);
    return {pk, rs: rsProcess(pk, complete, guess), T, shift};
  };
  /* 先用校準得到的起點與你設定的封包時間（發射端是用絕對時間排程，封包時間很準） */
  let best = attempt(T0, 0, Npk0, false);
  /* 驗證失敗 → 以 CRC 當裁判，搜尋封包時間（±2%）與起點偏移（±0.16 個封包），標頭宣告的封包數優先 */
  if(complete && best.rs.stage !== 'ok'){
    const tBegin = Date.now(), hdrOk = best.rs.hdr && best.rs.hdr.ok;
    const nWant = hdrOk ? best.rs.hdr.nTotal : Npk0;
    const cands = [];
    const addC = (T, cnt) => { if(cnt >= HDR_N) cands.push([T, cnt]); };
    addC(T0, nWant);
    if(tEnd !== null) for(const cnt of [nWant, Npk0, Npk0-1, Npk0+1]){
      const Tc = (tEnd - tS) / cnt; if(Math.abs(Tc - T0) < 0.12*T0) addC(Tc, cnt);
    }
    for(const f of [0.995, 1.005, 0.99, 1.01, 0.98, 1.02]) addC(T0*f, nWant);
    search: for(const sh of [0, -0.08, 0.08, -0.16, 0.16]){
      for(const [Tc, cnt] of cands){
        if(sh === 0 && Tc === T0 && cnt === Npk0) continue;
        if(Date.now() - tBegin > 15000) break search;
        const a = attempt(Tc, sh, cnt, false);
        if(a.rs.stage === 'ok'){ best = a; break search; }
        if(a.rs.hdr && a.rs.hdr.ok && !(best.rs.hdr && best.rs.hdr.ok)) best = a;
      }
    }
    /* 最後手段：標頭救不回來時，由封包總數反推 (K, nsym) */
    if(best.rs.stage !== 'ok' && !(best.rs.hdr && best.rs.hdr.ok)){
      const a = attempt(best.T, best.shift, best.pk.syms.length, true);
      if(a.rs.stage === 'ok') best = a;
    }
  }
  const pk = best.pk, rs = best.rs;
  const hex = pk.nibs.map(t => HEXC[t[0]]+HEXC[t[1]]+HEXC[t[2]]).join('');
  const finished = complete && (rs.stage === 'ok' || rs.stage === 'data-fail' || rs.stage === 'hdr-fail');
  return {state: finished ? 'done' : 'rx', done: done || finished, nibs: pk.nibs, flags: pk.flags, hex, T: best.T, Npk: pk.syms.length, cal, rs};
}
function analyze(final, msIn){
  const n = frames.length;
  if(n < 30) return {state:'wait', msg:'等待訊號…'};
  const T0 = Math.max(60, msIn || 100);
  if(calObj) return decodeWith(calObj, final);
  const dts = []; for(let i=Math.max(1,n-60); i<n; i++) dts.push(frames[i].t - frames[i-1].t);
  dts.sort((a,b)=>a-b); const dtMed = dts[dts.length>>1] || 33;
  const tLast = frames[n-1].t;
  for(let i=1;i<n;i++){
    if(!isCal0(frames[i].f) || isCal0(frames[i-1].f)) continue;
    const key = Math.round(frames[i].t/50);
    if(failed.has(key)) continue;
    if(tLast < frames[i].t + 17.6*T0 + Math.max(200, 2*T0)) return {state:'cal', msg:'偵測到可能的校準開頭，收集校準資料中…'};
    const cal = tryCal(frames[i].t - dtMed/2, T0);
    if(!cal){ failed.add(key); continue; }
    calObj = cal;
    return decodeWith(calObj, final);
  }
  return {state:'wait', msg:'尚未偵測到 16 段灰階校準。\n請對準色塊，並確認發射端「開始傳送」後才開始接收。'};
}
/*ANALYSIS_END*/

/* ============================================================
   相機與取樣
   ============================================================ */
const video = $('v'), ov = $('ov'), octx = ov.getContext('2d');
const samp = document.createElement('canvas'); samp.width = samp.height = 64;
const sctx = samp.getContext('2d', {willReadFrequently:true});
sctx.imageSmoothingQuality = 'high';
let stream = null, listening = false;
const roi = {cx:0.5, cy:0.5, size:0.6};
/* 邏輯區塊(A,B,G,K) → 相機畫面中的實際位置(0=左上,1=右上,2=左下,3=右下) */
const ROTMAP = {0:[0,1,2,3], 90:[1,3,0,2], 180:[3,2,1,0], 270:[2,0,3,1]};

function clampRoi(){
  const vw = video.videoWidth||1, vh = video.videoHeight||1;
  const half = roi.size*Math.min(vw,vh)/2;
  roi.cx = clamp(roi.cx, half/vw, 1-half/vw);
  roi.cy = clamp(roi.cy, half/vh, 1-half/vh);
}
function sample(){
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw) return null;
  clampRoi();
  const side = roi.size*Math.min(vw,vh);
  sctx.drawImage(video, roi.cx*vw-side/2, roi.cy*vh-side/2, side, side, 0, 0, 64, 64);
  const d = sctx.getImageData(0,0,64,64).data;
  const phys = new Float32Array(12);
  for(let cell=0;cell<4;cell++){
    const ox=(cell&1)*32, oy=(cell>>1)*32;
    let r=0,g=0,b=0,n=0;
    for(let y=oy+8;y<oy+24;y++) for(let x=ox+8;x<ox+24;x++){
      const p=(y*64+x)*4; r+=d[p]; g+=d[p+1]; b+=d[p+2]; n++;
    }
    phys[cell*3]=r/n; phys[cell*3+1]=g/n; phys[cell*3+2]=b/n;
  }
  const map = ROTMAP[$('rot').value], f = new Float32Array(12);
  for(let L=0;L<4;L++) for(let c=0;c<3;c++) f[L*3+c] = phys[map[L]*3+c];
  return f;
}
let lastLive = 0;
function onFrame(t){
  const f = sample();
  if(!f) return;
  if(listening){
    frames.push({t, f});
    if(frames.length > 8000) frames.splice(0, 2000);
  }
  if(t - lastLive > 120){
    lastLive = t;
    ['sA','sB','sG','sK'].forEach((id,i)=>{
      const e = $(id), r=f[i*3]|0, g=f[i*3+1]|0, b=f[i*3+2]|0;
      e.style.background = `rgb(${r},${g},${b})`;
      e.textContent = `${r},${g},${b}`;
    });
  }
}
function loopFrames(){
  if('requestVideoFrameCallback' in HTMLVideoElement.prototype){
    const cb = (now, meta) => { onFrame(meta && meta.captureTime ? meta.captureTime : now); video.requestVideoFrameCallback(cb); };
    video.requestVideoFrameCallback(cb);
  } else {
    const cb = now => { onFrame(now); requestAnimationFrame(cb); };
    requestAnimationFrame(cb);
  }
}
function drawGuide(){
  const w = ov.clientWidth, h = ov.clientHeight;
  if(ov.width !== w || ov.height !== h){ ov.width = w; ov.height = h; }
  octx.clearRect(0,0,w,h);
  if(video.videoWidth){
    clampRoi();
    const sc = w / video.videoWidth;
    const side = roi.size*Math.min(video.videoWidth, video.videoHeight)*sc;
    const x = roi.cx*w - side/2, y = roi.cy*h - side/2;
    octx.strokeStyle = '#3f8'; octx.lineWidth = 2;
    octx.strokeRect(x,y,side,side);
    octx.beginPath(); octx.moveTo(x+side/2,y); octx.lineTo(x+side/2,y+side); octx.moveTo(x,y+side/2); octx.lineTo(x+side,y+side/2); octx.stroke();
    octx.fillStyle = '#3f8'; octx.font = '12px sans-serif';
    const map = ROTMAP[$('rot').value], names = ['−10','+10','灰階','黑'];
    for(let L=0;L<4;L++){
      const cell = map[L];
      octx.fillText(names[L], x + (cell&1)*side/2 + 4, y + (cell>>1)*side/2 + 14);
    }
  }
  requestAnimationFrame(drawGuide);
}
let drag = null;
ov.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; ov.setPointerCapture(e.pointerId); });
ov.addEventListener('pointermove', e => {
  if(!drag) return;
  roi.cx += (e.clientX-drag.x)/ov.clientWidth;
  roi.cy += (e.clientY-drag.y)/ov.clientHeight;
  drag = {x:e.clientX, y:e.clientY};
});
ov.addEventListener('pointerup', () => drag = null);
$('size').oninput = () => roi.size = $('size').value/100;

$('cam').onclick = async () => {
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60}}, audio:false});
    video.srcObject = stream; await video.play();
    $('cam').textContent = '相機已啟動';
    $('status').textContent = '相機已啟動。移動取樣框並調整大小，使四個色塊各落在框內四格；下方四個小方塊應與發射端顏色一致。';
    loopFrames(); drawGuide();
  }catch(err){
    $('status').textContent = '無法開啟相機：' + err.message + '\n（需要 https 或 localhost，並允許相機權限）';
  }
};
$('lock').onclick = async () => {
  if(!stream){ $('status').textContent = '請先啟動相機'; return; }
  const tr = stream.getVideoTracks()[0];
  const caps = tr.getCapabilities ? tr.getCapabilities() : {}, st = tr.getSettings ? tr.getSettings() : {};
  const adv = {}, msg = [];
  if(caps.exposureMode && caps.exposureMode.includes('manual')){
    adv.exposureMode = 'manual'; if(st.exposureTime) adv.exposureTime = st.exposureTime; msg.push('曝光：手動');
  } else msg.push('曝光：此瀏覽器/裝置不支援鎖定');
  if(caps.whiteBalanceMode && caps.whiteBalanceMode.includes('manual')){
    adv.whiteBalanceMode = 'manual'; if(st.colorTemperature) adv.colorTemperature = st.colorTemperature; msg.push('白平衡：手動');
  } else msg.push('白平衡：此瀏覽器/裝置不支援鎖定');
  if(Object.keys(adv).length){ try{ await tr.applyConstraints({advanced:[adv]}); }catch(e){ msg.push('套用失敗：'+e.message); } }
  msg.push('（不支援時也沒關係：接收端會把左上/右上區塊相對於灰階與全黑區塊做比例歸一，抵消曝光與白平衡的變動）');
  $('status').textContent = msg.join('\n');
};

/* ============================================================
   接收流程
   ============================================================ */
/* 校準摘要：歸一基準與 gamma 曲線資訊 */
function calSummary(cal){
  if(!cal) return '';
  const fmt = v => Number.isFinite(v) ? v.toFixed(2) : '—';
  const gm = c => { const a = cal.cA[c].gamma, b = cal.cB[c].gamma; return fmt((a+b)/2); };
  const mod = cal.cA.concat(cal.cB).every(cv => cv.model === 'gamma') ? 'γ 擬合曲線' : '實測點分段線性曲線';
  return `歸一基準 G−K（灰階−黑）：R ${cal.gk[0].toFixed(0)} / G ${cal.gk[1].toFixed(0)} / B ${cal.gk[2].toFixed(0)}\n` +
         `系統 Gamma：R ${gm(0)} / G ${gm(1)} / B ${gm(2)}　曲線：${mod}　雜訊 σ≈${cal.sigmaN.toFixed(3)}`;
}
/* 畫出由 16 階灰階建立的曲線（R/G/B 各一色；實線=左上、虛線=右上、點=實測） */
let drawnCal = null;
function clearCurves(){ drawnCal = null; const cv = $('curve'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); }
function drawCurves(cal){
  const cv = $('curve'), g = cv.getContext('2d'), W = cv.width, H = cv.height;
  const L = 36, R = 10, Tp = 10, B = 22;
  g.clearRect(0,0,W,H); g.fillStyle = '#161616'; g.fillRect(0,0,W,H);
  let ymax = 1.2;
  for(let c=0;c<3;c++) ymax = Math.max(ymax, evalCurve(cal.cA[c],250), evalCurve(cal.cB[c],250));
  ymax = Math.ceil(ymax*5)/5;
  const X = s => L + s/255*(W-L-R), Y = y => H-B - clamp(y,-0.05,ymax)/ymax*(H-B-Tp);
  g.font = '11px sans-serif'; g.lineWidth = 1; g.strokeStyle = '#333'; g.fillStyle = '#888';
  for(let s=0;s<=255;s+=64){ g.beginPath(); g.moveTo(X(s),Tp); g.lineTo(X(s),H-B); g.stroke(); g.fillText(String(s), X(s)-8, H-6); }
  g.fillText('255', X(255)-18, H-6);
  for(let y=0;y<=ymax+1e-6;y+=0.5){ g.beginPath(); g.moveTo(L,Y(y)); g.lineTo(W-R,Y(y)); g.stroke(); g.fillText(y.toFixed(1), 4, Y(y)+4); }
  g.strokeStyle = '#777'; g.setLineDash([2,4]);                     // 灰階基準：(128, 1.0)
  g.beginPath(); g.moveTo(X(128),Tp); g.lineTo(X(128),H-B); g.moveTo(L,Y(1)); g.lineTo(W-R,Y(1)); g.stroke(); g.setLineDash([]);
  const col = ['#f66','#6d6','#6af'];
  for(let c=0;c<3;c++){
    [[cal.cA[c], false],[cal.cB[c], true]].forEach(([cur, dashed]) => {
      g.strokeStyle = col[c]; g.fillStyle = col[c]; g.lineWidth = 1.5; g.setLineDash(dashed ? [5,3] : []);
      g.beginPath();
      for(let s=0;s<=255;s+=3){ const px = X(s), py = Y(evalCurve(cur, s)); if(s===0) g.moveTo(px,py); else g.lineTo(px,py); }
      g.stroke(); g.setLineDash([]);
      for(let i=0;i<cur.rawX.length;i++){ g.beginPath(); g.arc(X(cur.rawX[i]), Y(cur.raw[i]), 2, 0, 6.3); g.fill(); }
    });
  }
}
function render(res){
  let s = res.msg || '';
  if(res.nibs){
    const rs = res.rs || {}, H = rs.hdr, D = rs.data;
    const bad = res.flags.filter(x=>x===2).length, warn = res.flags.filter(x=>x===1).length;
    const lines = [
      (D && D.ok) ? '✔ 接收完成，Reed-Solomon 校驗通過' :
      rs.stage === 'data-fail' ? '✘ 校驗失敗：錯誤超出 Reed-Solomon 可修正的範圍（下方為未修正的原始內容）' :
      rs.stage === 'hdr-fail' ? '✘ 標頭無法解出（下方為未修正的原始內容）' :
      res.done ? '接收完成' : '接收中…',
      `校準：已完成　封包時間 ≈ ${res.T.toFixed(1)} ms`,
      calSummary(res.cal),
      `收到封包 ${res.Npk} 個　信心偏低 ${warn}　疑似錯誤 ${bad}`
    ];
    if(H && H.ok){
      lines.push(`標頭：✔ 資料符號 ${H.K}（含 CRC 2）、校驗 ${H.nsym}、共 ${H.nTotal} 個封包` + (H.nErr || H.nEra ? `　標頭已修正 ${H.nErr} 錯誤` : ''));
      if(rs.stage === 'partial') lines.push(`尚未收齊：還差 ${H.nTotal - res.Npk} 個封包`);
    } else if(H && H.guessed) lines.push(`標頭：✘ 無法解出，改由封包總數反推（資料符號 ${H.K}、校驗 ${H.nsym}），資料 CRC 驗證通過`);
    else if(H) lines.push('標頭：✘ 無法解出');
    if(rs.missing) lines.push(`缺少 ${rs.missing} 個封包，已當作抹除處理`);
    if(D && D.ok){
      lines.push(`修正：${D.nErr} 個未知位置的錯誤封包 + 使用 ${D.nEra} 個抹除　（資料 CRC-24 ✔，嘗試 ${D.tried} 次）`);
    }
    s = lines.filter(Boolean).join('\n');
    if(res.cal && res.cal !== drawnCal){ drawnCal = res.cal; drawCurves(res.cal); }
    const fixed = new Set(D && D.ok ? D.fixed : []);
    const hk = H && (H.ok || H.guessed), nHdr = hk ? HDR_N : 0, K = hk ? H.K : 0;
    $('packets').innerHTML = res.nibs.map((t,i)=>{
      let cls = res.flags[i]===2 ? 'bad' : res.flags[i]===1 ? 'warn' : '';
      if(fixed.has(i)) cls = 'fix';
      if(hk){ if(i < nHdr) cls += ' hdr'; else if(i < nHdr + 2) cls += ' crc'; else if(i >= nHdr + K) cls += ' par'; }
      return `<span class="${cls}">${HEXC[t[0]]+HEXC[t[1]]+HEXC[t[2]]}</span>`;
    }).join('');
    let hex;
    if(D && D.ok) hex = D.hex;
    else if(hk) hex = res.hex.slice((nHdr + 2)*3, (nHdr + K)*3);   // 未修正的資料部分
    else hex = res.hex;
    const L = +$('len').value;
    if(L > 0) hex = hex.slice(0, L);
    $('hex').value = hex;
    $('textOut').value = hexToText(hex);
  }
  $('status').textContent = s;
}
/* 文字解碼規則：hex 每 6 個字元為一個字，尾端用 f 補滿
   例：259 91f → "25991f" → 去掉尾端 f → 十進位 25991 → U+6587「文」
   （5 位數補 1 個 f；4 位數補 2 個 f；6 位數不補）*/
function hexToText(hex){
  let out = '';
  for(let i=0; i+6<=hex.length; i+=6){
    const unit = hex.slice(i, i+6).replace(/f+$/,'');
    const cp = /^\d+$/.test(unit) ? parseInt(unit,10) : NaN;
    if(Number.isNaN(cp) || cp > 0x10FFFF || (cp >= 0xD800 && cp <= 0xDFFF)) out += '�';
    else out += String.fromCodePoint(cp);
  }
  return out;
}
let timer = null;
function startListen(){
  if(!stream){ $('status').textContent = '請先啟動相機'; return; }
  frames.length = 0; calObj = null; failed.clear();
  $('packets').innerHTML = ''; $('hex').value = ''; $('textOut').value = ''; clearCurves();
  listening = true;
  $('go').textContent = '停止並解碼'; $('go').className = 'stop';
  $('status').textContent = '監聽中… 請在發射端按「開始傳送」。';
  timer = setInterval(() => {
    if(!listening) return;
    const r = analyze(false, +$('ms').value);
    render(r);
    if(r.done) stopListen(false);
  }, 400);
}
function stopListen(final){
  listening = false; clearInterval(timer);
  $('go').textContent = '開始接收'; $('go').className = '';
  if(final){ const r = analyze(true, +$('ms').value); render(r); }
}
$('go').onclick = () => listening ? stopListen(true) : startListen();
$('rst').onclick = () => {
  stopListen(false);
  frames.length = 0; calObj = null; failed.clear();
  $('packets').innerHTML = ''; $('hex').value = ''; $('textOut').value = ''; clearCurves();
  $('status').textContent = '已重置。';
};
$('copyText').onclick = async () => {
  try{ await navigator.clipboard.writeText($('textOut').value); $('status').textContent += '\n已複製文字'; }
  catch(e){ $('textOut').select(); document.execCommand('copy'); }
};
$('copy').onclick = async () => {
  try{ await navigator.clipboard.writeText($('hex').value); $('status').textContent += '\n已複製'; }
  catch(e){ $('hex').select(); document.execCommand('copy'); }
};
</script>
